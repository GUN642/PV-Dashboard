name: Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 0.1.${{ github.run_number }}
      IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: eigener Signaturschlüssel über Repository-Secrets (siehe README).
      - name: Signaturschlüssel aus Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Eigener Schlüssel wird verwendet."
          fi

      - name: Tests und APK bauen
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk PV-Dashboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PV-Dashboard-${{ env.VERSION }}
          path: PV-Dashboard.apk

      # Jede erfolgreiche Version wird als GitHub-Release mit APK veröffentlicht.
      # Builds von main sind "Latest", Builds anderer Branches Vorabversionen.
      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: PV Dashboard ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.IS_MAIN != 'true' }}
          make_latest: ${{ env.IS_MAIN }}
          files: PV-Dashboard.apk
          body: |
            **Installation:** `PV-Dashboard.apk` unten auf dem Handy herunterladen und öffnen.
            Beim ersten Mal muss Android die Installation aus dieser Quelle (Browser/Dateien) erlauben.

            Branch: `${{ github.ref_name }}` · Commit: ${{ github.sha }}
