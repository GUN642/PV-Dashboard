name: Android APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 0.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: eigener Signaturschlüssel über Repository-Secrets (siehe README).
      - name: Signaturschlüssel aus Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Eigener Schlüssel wird verwendet."
          fi

      - name: Tests und APK bauen
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "VOID-Home-Dashboard-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: VOID-Home-Dashboard-${{ env.VERSION }}
          path: VOID-Home-Dashboard-${{ env.VERSION }}.apk

      # Änderungen seit dem letzten Release aus den Commit-Nachrichten
      - name: Release-Notizen
        if: github.ref == 'refs/heads/main'
        run: |
          PREV=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          RANGE="HEAD"
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; fi
          git log --no-merges --format='%b' $RANGE \
            | grep -v -i -e '^Co-Authored-By' -e '^Claude-Session' \
            | sed '/^[[:space:]]*$/d' > notes.md || true
          if [ ! -s notes.md ]; then git log -1 --format='- %s' > notes.md; fi
          cat notes.md

      - name: Release veröffentlichen
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: VOID Home Dashboard ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          body_path: notes.md
          files: VOID-Home-Dashboard-${{ env.VERSION }}.apk
