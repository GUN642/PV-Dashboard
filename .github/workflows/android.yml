name: Android APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 0.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Signaturschlüssel nur aus Repository-Secrets (siehe README) – im Repository liegt keiner.
      # Releases (main) brauchen ihn zwingend; Testbuilds anderer Branches nutzen einen Wegwerf-Schlüssel.
      - name: Signaturschlüssel
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.p12"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            {
              echo "SIGNING_KEYSTORE_FILE=$KS"
              echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD"
              echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
              echo "SIGNING_KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "Geheimer Signaturschlüssel aus den Secrets wird verwendet."
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "::error::Kein Signaturschlüssel: bitte die Secrets SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD und SIGNING_KEY_ALIAS anlegen (siehe README)."
            exit 1
          else
            PW="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias test -keyalg RSA -keysize 2048 \
              -validity 2 -storepass "$PW" -keypass "$PW" -dname "CN=Testbuild" -noprompt
            echo "::add-mask::$PW"
            {
              echo "SIGNING_KEYSTORE_FILE=$KS"
              echo "SIGNING_STORE_PASSWORD=$PW"
              echo "SIGNING_KEY_ALIAS=test"
              echo "SIGNING_KEY_PASSWORD=$PW"
            } >> "$GITHUB_ENV"
            echo "Testbuild: Wegwerf-Schlüssel (diese APK lässt sich nicht über die installierte App aktualisieren)."
          fi

      - name: Tests und APK bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "VOID-Home-Dashboard-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: VOID-Home-Dashboard-${{ env.VERSION }}
          path: VOID-Home-Dashboard-${{ env.VERSION }}.apk

      # Änderungen seit dem letzten Release aus den Commit-Nachrichten
      - name: Release-Notizen
        if: github.ref == 'refs/heads/main'
        run: |
          PREV=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          RANGE="HEAD"
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; fi
          git log --no-merges --format='%b' $RANGE \
            | grep -v -i -e '^Co-Authored-By' -e '^Claude-Session' \
            | sed '/^[[:space:]]*$/d' > notes.md || true
          if [ ! -s notes.md ]; then git log -1 --format='- %s' > notes.md; fi
          cat notes.md

      - name: Release veröffentlichen
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: VOID Home Dashboard ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          body_path: notes.md
          files: VOID-Home-Dashboard-${{ env.VERSION }}.apk
